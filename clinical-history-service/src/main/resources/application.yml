spring:
  application:
    name: clinical-history-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  seguridad:
    modo: ${SECURITY_MODE:local}
    claim-id-profesional: ${PROFESSIONAL_ID_CLAIM:professional_id}
    claim-nombre-profesional: ${PROFESSIONAL_NAME_CLAIM:professional_name}
    claim-matricula-profesional: ${PROFESSIONAL_LICENSE_CLAIM:professional_license}
    audiencia: ${JWT_AUDIENCE:clinical-history-service}
    profesional-local-id: ${LOCAL_PROFESSIONAL_ID:1}
    profesional-local-nombre: ${LOCAL_PROFESSIONAL_NAME:Profesional local}
    profesional-local-matricula: ${LOCAL_PROFESSIONAL_LICENSE:LOCAL}
  auditoria:
    clave-base64: ${AUDIT_ENCRYPTION_KEY}
    retencion-anios: ${AUDIT_RETENTION_YEARS:10}
    confiar-cabeceras-proxy: ${TRUST_PROXY_HEADERS:false}
  archivos:
    cuota-recomendada-bytes: ${CLINICAL_FILES_RECOMMENDED_BYTES:524288000}
    retencion-anios-minima: ${CLINICAL_FILES_RETENTION_YEARS:10}
    storage:
      bucket: ${CLINICAL_FILES_BUCKET:clinical-files}
      region: ${CLINICAL_FILES_REGION:us-east-1}
      endpoint: ${CLINICAL_FILES_ENDPOINT:http://localhost:9000}
      access-key: ${CLINICAL_FILES_ACCESS_KEY}
      secret-key: ${CLINICAL_FILES_SECRET_KEY}
      path-style: ${CLINICAL_FILES_PATH_STYLE:true}
    malware:
      host: ${CLAMAV_HOST:localhost}
      port: ${CLAMAV_PORT:3310}
      timeout-millis: ${CLAMAV_TIMEOUT_MILLIS:10000}
