services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinical_history}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - red_clinica

  clinical-history-service:
    build:
      context: ./clinical-history-service
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-clinical_history}
      DB_USER: ${POSTGRES_USER:?Defina POSTGRES_USER en .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      SERVER_PORT: 8080
      AUDIT_ENCRYPTION_KEY: ${AUDIT_ENCRYPTION_KEY:?Defina AUDIT_ENCRYPTION_KEY con 32 bytes codificados en Base64}
      AUDIT_RETENTION_YEARS: ${AUDIT_RETENTION_YEARS:-10}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      SECURITY_MODE: ${SECURITY_MODE:-local}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-clinical-history-service}
      PROFESSIONAL_ID_CLAIM: ${PROFESSIONAL_ID_CLAIM:-professional_id}
      PROFESSIONAL_NAME_CLAIM: ${PROFESSIONAL_NAME_CLAIM:-professional_name}
      PROFESSIONAL_LICENSE_CLAIM: ${PROFESSIONAL_LICENSE_CLAIM:-professional_license}
      LOCAL_PROFESSIONAL_ID: ${LOCAL_PROFESSIONAL_ID:-1}
      LOCAL_PROFESSIONAL_NAME: ${LOCAL_PROFESSIONAL_NAME:-Profesional local}
      LOCAL_PROFESSIONAL_LICENSE: ${LOCAL_PROFESSIONAL_LICENSE:-LOCAL}
      CLINICAL_FILES_BUCKET: ${CLINICAL_FILES_BUCKET:-clinical-files}
      CLINICAL_FILES_REGION: ${CLINICAL_FILES_REGION:-us-east-1}
      CLINICAL_FILES_ENDPOINT: ${CLINICAL_FILES_ENDPOINT:-http://minio:9000}
      CLINICAL_FILES_ACCESS_KEY: ${CLINICAL_FILES_ACCESS_KEY:?Defina CLINICAL_FILES_ACCESS_KEY en .env}
      CLINICAL_FILES_SECRET_KEY: ${CLINICAL_FILES_SECRET_KEY:?Defina CLINICAL_FILES_SECRET_KEY en .env}
      CLINICAL_FILES_PATH_STYLE: ${CLINICAL_FILES_PATH_STYLE:-true}
      CLINICAL_FILES_RECOMMENDED_BYTES: ${CLINICAL_FILES_RECOMMENDED_BYTES:-524288000}
      CLINICAL_FILES_RETENTION_YEARS: ${CLINICAL_FILES_RETENTION_YEARS:-10}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_MILLIS: ${CLAMAV_TIMEOUT_MILLIS:-10000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      clamav:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - red_clinica

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${CLINICAL_FILES_ACCESS_KEY:?Defina CLINICAL_FILES_ACCESS_KEY en .env}
      MINIO_ROOT_PASSWORD: ${CLINICAL_FILES_SECRET_KEY:?Defina CLINICAL_FILES_SECRET_KEY en .env}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    networks:
      - red_clinica

  clamav:
    image: clamav/clamav:stable
    volumes:
      - clamav_data:/var/lib/clamav
    restart: unless-stopped
    networks:
      - red_clinica

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      clinical-history-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - red_clinica

volumes:
  postgres_data:
  minio_data:
  clamav_data:

networks:
  red_clinica:
    driver: bridge
