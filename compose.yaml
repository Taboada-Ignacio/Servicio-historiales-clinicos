services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinical_history}
      POSTGRES_USER: ${POSTGRES_USER:-clinical_history}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - red_clinica

  clinical-history-service:
    build:
      context: ./clinical-history-service
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-clinical_history}
      DB_USER: ${POSTGRES_USER:-clinical_history}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      SERVER_PORT: 8080
      AUDIT_ENCRYPTION_KEY: ${AUDIT_ENCRYPTION_KEY:?Defina AUDIT_ENCRYPTION_KEY con 32 bytes codificados en Base64}
      AUDIT_RETENTION_YEARS: ${AUDIT_RETENTION_YEARS:-10}
      SECURITY_MODE: ${SECURITY_MODE:-local}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-clinical-history-service}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - red_clinica

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      clinical-history-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - red_clinica

volumes:
  postgres_data:

networks:
  red_clinica:
    driver: bridge
